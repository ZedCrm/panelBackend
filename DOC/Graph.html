<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>معماری توسعه ویژگی جدید | جریان تمیز از پایین به بالا</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background: #0a0f1c;
            color: #e2e8f0;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.2rem;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        svg {
            width: 100%;
            height: 80vh;
            max-height: 720px;
            background: #0a0f1c;
            border-radius: 1.5rem;
        }

        .node-group {
            cursor: pointer;
            transition: filter 0.2s ease;
        }

            .node-group:hover {
                filter: brightness(1.1) drop-shadow(0 0 10px rgba(59,130,246,0.4));
            }

        .node-rect {
            transition: stroke 0.2s ease, stroke-width 0.2s ease;
        }

        .node-group:hover .node-rect {
            stroke-width: 2.5;
            stroke: #60a5fa;
        }

        .node text {
            pointer-events: none;
            font-weight: 600;
        }

        .flow-line {
            stroke: #475569;
            stroke-width: 2.5;
            fill: none;
        }

        .legend {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: rgba(10, 15, 28, 0.85);
            padding: 0.6rem 1rem;
            border-radius: 0.8rem;
            backdrop-filter: blur(8px);
            border: 1px solid #1e293b;
            font-size: 0.7rem;
            z-index: 10;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .footer {
            position: absolute;
            bottom: 0.8rem;
            right: 1rem;
            color: #475569;
            font-size: 0.7rem;
            z-index: 10;
        }

        @media (max-width: 800px) {
            h1 {
                font-size: 1.2rem;
            }

            .subtitle {
                font-size: 0.7rem;
            }

            .legend {
                bottom: 0.5rem;
                left: 0.5rem;
                padding: 0.3rem 0.6rem;
            }

            .footer {
                right: 0.5rem;
                font-size: 0.6rem;
            }

            .node text {
                font-size: 10px;
            }

            .node .title {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ معماری توسعه ویژگی جدید</h1>
        <p class="subtitle">جریان تمیز از پایین به بالا | Clean Architecture</p>

        <svg id="diagram" viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="grad-domain" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3b82f6" />
                    <stop offset="100%" stop-color="#1e3a8a" />
                </linearGradient>
                <linearGradient id="grad-conf" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#10b981" />
                    <stop offset="100%" stop-color="#065f46" />
                </linearGradient>
                <linearGradient id="grad-contracts" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#92400e" />
                </linearGradient>
                <linearGradient id="grad-object" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="100%" stop-color="#5b21b6" />
                </linearGradient>
                <linearGradient id="grad-api" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ec4899" />
                    <stop offset="100%" stop-color="#be185d" />
                </linearGradient>
                <linearGradient id="grad-di" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#475569" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>
                <linearGradient id="grad-migration" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#06b6d4" />
                    <stop offset="100%" stop-color="#0891b2" />
                </linearGradient>
                <linearGradient id="grad-test" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#84cc16" />
                    <stop offset="100%" stop-color="#4d7c0f" />
                </linearGradient>

                <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
                </marker>
                <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#10b981" />
                </marker>
                <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
                </marker>
                <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa" />
                </marker>
                <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#ec4899" />
                </marker>
                <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4" />
                </marker>
                <marker id="arrow-lime" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#a3e635" />
                </marker>
            </defs>

            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" />
            </pattern>
            <rect width="1100" height="620" fill="#0a0f1c" />
            <rect width="1100" height="620" fill="url(#grid)" opacity="0.25" />

            <!-- ======================== BOXES ======================== -->
            <!-- ردیف بالا (y=80): Domain, Object, API -->
            <g class="node-group" data-step="1" transform="translate(70, 75)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-domain)" stroke="#3b82f6" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#1e40af" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">1</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">Domain</text>
                <text x="95" y="65" text-anchor="middle" fill="#bfdbfe" font-size="11">BaseDomain + Entity</text>
            </g>

            <g class="node-group" data-step="4" transform="translate(410, 75)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-object)" stroke="#8b5cf6" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#4c1d95" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">4</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">Object</text>
                <text x="95" y="65" text-anchor="middle" fill="#e9d5ff" font-size="11">CrudService</text>
            </g>

            <g class="node-group" data-step="5" transform="translate(790, 75)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-api)" stroke="#ec4899" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#831843" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">5</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">API</text>
                <text x="95" y="65" text-anchor="middle" fill="#fbcfe8" font-size="11">Controller</text>
            </g>

            <!-- ردیف وسط (y=250): ConfApp, Contracts, DI -->
            <g class="node-group" data-step="2" transform="translate(70, 250)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-conf)" stroke="#10b981" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#065f46" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">2</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">ConfApp</text>
                <text x="95" y="65" text-anchor="middle" fill="#bbf7d0" font-size="11">Context + Mapping</text>
            </g>

            <g class="node-group" data-step="3" transform="translate(410, 250)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-contracts)" stroke="#f59e0b" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#92400e" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">3</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">Contracts</text>
                <text x="95" y="65" text-anchor="middle" fill="#fed7aa" font-size="11">DTO + Interface</text>
            </g>

            <g class="node-group" data-step="6" transform="translate(790, 250)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-di)" stroke="#64748b" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#0f172a" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">6</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">DI</text>
                <text x="95" y="65" text-anchor="middle" fill="#cbd5e1" font-size="11">Program.cs</text>
            </g>

            <!-- ردیف پایین (y=430): Migration, Test -->
            <g class="node-group" data-step="7" transform="translate(240, 430)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-migration)" stroke="#06b6d4" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#164e63" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">7</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">Migration</text>
                <text x="95" y="65" text-anchor="middle" fill="#cffafe" font-size="11">EF Core</text>
            </g>

            <g class="node-group" data-step="8" transform="translate(630, 430)">
                <rect class="node-rect" width="190" height="90" rx="14" fill="url(#grad-test)" stroke="#84cc16" stroke-width="1.5" />
                <circle cx="28" cy="28" r="17" fill="#3f6212" />
                <text x="28" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="bold">8</text>
                <text class="title" x="95" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">تست</text>
                <text x="95" y="65" text-anchor="middle" fill="#ecfccb" font-size="11">Postman / Swagger</text>
            </g>

            <!-- ======================== FLOW LINES (از پایین به بالا) ======================== -->
            <!-- 1 ← 2 : از پایین باکس 2 به بالای باکس 1 -->
            <path d="M165,340 L165,200 Q165,175 165,165" class="flow-line" stroke="#10b981" marker-end="url(#arrow-green)">
                <animate attributeName="stroke-dasharray" from="0 180" to="180 0" dur="0.8s" fill="freeze" />
            </path>

            <!-- 2 ← 3 : از پایین باکس 3 به بالای باکس 2 (افقی) -->
            <path d="M410,295 L410,250" class="flow-line" stroke="#f59e0b" marker-end="url(#arrow-orange)">
                <animate attributeName="stroke-dasharray" from="0 160" to="160 0" dur="0.7s" fill="freeze" begin="0.2s" />
            </path>

            <!-- 3 ← 4 : از پایین باکس 4 به بالای باکس 3 -->
            <path d="M505,340 L505,200 Q505,175 505,165" class="flow-line" stroke="#a78bfa" marker-end="url(#arrow-purple)">
                <animate attributeName="stroke-dasharray" from="0 180" to="180 0" dur="0.8s" fill="freeze" begin="0.4s" />
            </path>

            <!-- 4 ← 5 : از پایین باکس 5 به بالای باکس 4 -->
            <path d="M885,250 L885,165" class="flow-line" stroke="#ec4899" marker-end="url(#arrow-pink)">
                <animate attributeName="stroke-dasharray" from="0 90" to="90 0" dur="0.6s" fill="freeze" begin="0.3s" />
            </path>

            <!-- 1 ← 4 : ارتباط مستقیم Domain و Object -->
            <path d="M260,340 L260,210 Q260,165 260,165" class="flow-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)" stroke-dasharray="6 4" opacity="0.6" />

            <!-- 6 (DI) به 4 و 5 : از پایین DI به بالا Object و API -->
            <path d="M885,340 L885,200 Q885,175 885,165" class="flow-line" stroke="#94a3b8" stroke-dasharray="5 5" opacity="0.5" />

            <!-- 2 ← 7 : از پایین باکس 7 به بالای باکس 2 -->
            <path d="M335,520 L335,380 Q335,340 335,340" class="flow-line" stroke="#06b6d4" marker-end="url(#arrow-cyan)">
                <animate attributeName="stroke-dasharray" from="0 180" to="180 0" dur="1s" fill="freeze" begin="0.5s" />
            </path>

            <!-- 7 ← 8 : از پایین باکس 8 به بالای باکس 7 -->
            <path d="M725,520 L725,475 Q725,430 725,430" class="flow-line" stroke="#a3e635" marker-end="url(#arrow-lime)">
                <animate attributeName="stroke-dasharray" from="0 95" to="95 0" dur="0.6s" fill="freeze" begin="0.6s" />
            </path>

            <!-- 8 به API (بازخورد تست) -->
            <path d="M820,430 L820,250 Q975,200 975,165" class="flow-line" stroke="#facc15" stroke-dasharray="5 4" opacity="0.45" />

            <g id="particles"></g>
        </svg>

        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#3b82f6"></div><span>Domain</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#10b981"></div><span>ConfApp</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#f59e0b"></div><span>Contracts</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#8b5cf6"></div><span>Object (Core)</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#ec4899"></div><span>API</span></div>
        </div>
        <div class="footer">⬆️ فلش‌ها از پایین هر باکس به بالای باکس بعدی | بدون لرزش | معماری تمیز</div>
    </div>

    <script>
        // حذف هرگونه لرزش - فقط تغییر opacity در هاور
        const groups = document.querySelectorAll('.node-group');
        groups.forEach(group => {
            group.addEventListener('mouseenter', () => {
                groups.forEach(g => g.style.opacity = '0.55');
                group.style.opacity = '1';
            });
            group.addEventListener('mouseleave', () => {
                groups.forEach(g => g.style.opacity = '1');
            });
        });

        // ذرات متحرک در پس‌زمینه (اختیاری)
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", "2");
            circle.setAttribute("fill", "#3b82f6");
            circle.style.opacity = Math.random() * 0.4;
            const cx = 50 + Math.random() * 1000;
            const cy = 30 + Math.random() * 560;
            circle.setAttribute("cx", cx);
            circle.setAttribute("cy", cy);

            const dx = (Math.random() - 0.5) * 60;
            const dy = (Math.random() - 0.5) * 40;
            const dur = 6 + Math.random() * 10;

            const animX = document.createElementNS("http://www.w3.org/2000/svg", "animate");
            animX.setAttribute("attributeName", "cx");
            animX.setAttribute("values", `${cx};${cx + dx};${cx}`);
            animX.setAttribute("dur", `${dur}s`);
            animX.setAttribute("repeatCount", "indefinite");

            const animY = document.createElementNS("http://www.w3.org/2000/svg", "animate");
            animY.setAttribute("attributeName", "cy");
            animY.setAttribute("values", `${cy};${cy + dy};${cy}`);
            animY.setAttribute("dur", `${dur}s`);
            animY.setAttribute("repeatCount", "indefinite");

            circle.appendChild(animX);
            circle.appendChild(animY);
            particleContainer.appendChild(circle);
        }
    </script>
</body>
</html>
